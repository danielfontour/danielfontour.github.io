<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fontoura Planejamento — Daniel Fontoura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz@9..144,wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     PALETA — para trocar as cores do site, edite só aqui.
     Tons terrosos: bege de fundo, marrom para texto, terracota
     como cor de destaque e verde-oliva como segunda cor.
     ========================================================= */
  :root{
    --bg: #f6f0e4;         /* fundo geral (bege claro) */
    --bg-card: #fffdfa;    /* fundo dos cards (quase branco, quente) */
    --bg-soft: #ece0c8;    /* fundo de tarjas/chips/seções alternadas */
    --ink: #3a2c22;        /* texto principal (marrom escuro) */
    --ink-dim: #7d6a55;    /* texto secundário (marrom acastanhado) */
    --line: #e0d2b4;       /* linhas e bordas */
    --accent: #a1522c;     /* terracota — destaques, botões, links */
    --accent-dark: #7c3f21;
    --accent-2: #6d7a4f;   /* verde-oliva — segunda cor de apoio */
    --accent-soft: rgba(161,82,44,0.10);
    --accent2-soft: rgba(109,122,79,0.12);
    --radius: 16px;
    --maxw: 1080px;
    --header-h: 68px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Manrope', system-ui, sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow:hidden; /* o scroll acontece dentro de cada página, não na página toda */
  }
  h1,h2,h3,h4{
    font-family:'Fraunces', 'Manrope', serif;
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0;
    color:var(--ink);
  }
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px;}
  ::selection{background:var(--accent-soft);}

  /* NAV */
  header{
    position:fixed; top:0; left:0; right:0; height:var(--header-h); z-index:50;
    background:rgba(246,240,228,0.92);
    backdrop-filter: blur(10px);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center;
  }
  nav{
    width:100%; max-width:var(--maxw); margin:0 auto; padding:0 28px;
    display:flex; align-items:center; justify-content:space-between; gap:14px;
  }
  .logo{font-family:'Fraunces',serif; font-weight:700; font-size:1.05rem; letter-spacing:0.01em; white-space:nowrap;}
  .logo span{color:var(--accent);}
  .nav-right{display:flex; align-items:center; gap:6px;}
  .navlinks{display:flex; gap:8px; list-style:none; margin:0; padding:0;}
  .navlinks button{
    font-family:inherit; font-size:0.86rem; color:var(--ink-dim); font-weight:700;
    background:none; border:none; cursor:pointer; padding:9px 16px; border-radius:999px;
    transition:all .2s;
  }
  .navlinks button:hover{color:var(--accent);}
  .navlinks button.active{background:var(--accent); color:#fff8f0;}
  .lang-toggle{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; margin-left:6px;}
  .lang-toggle button{
    font-family:inherit; font-size:0.76rem; font-weight:800; color:var(--ink-dim);
    background:var(--bg-card); border:none; cursor:pointer; padding:8px 12px; transition:all .2s;
  }
  .lang-toggle button.active{background:var(--accent); color:#fff8f0;}
  .navtoggle{display:none; background:none; border:none; color:var(--ink); font-size:1.4rem; cursor:pointer;}
  @media (max-width:760px){
    .navlinks{
      position:fixed; top:var(--header-h); right:0; left:0; background:var(--bg);
      flex-direction:column; gap:0; border-bottom:1px solid var(--line);
      max-height:0; overflow:hidden; transition:max-height .3s ease; padding:0;
    }
    .navlinks.open{max-height:400px; padding:8px;}
    .navlinks button{display:block; width:100%; text-align:left; border-radius:10px;}
    .navtoggle{display:block;}
  }

  /* PAGES — cada uma ocupa a viewport inteira (menos o header) e rola internamente */
  .page{
    position:fixed; top:var(--header-h); left:0; right:0; bottom:0;
    overflow-y:auto;
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .25s ease;
  }
  .page.active{opacity:1; visibility:visible; pointer-events:auto;}
  .page-inner{max-width:var(--maxw); margin:0 auto; padding:40px 28px 80px;}

  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:0.76rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--accent); margin-bottom:14px;
  }
  .eyebrow::before{content:''; width:7px; height:7px; border-radius:50%; background:var(--accent); display:inline-block;}

  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:12px 20px; border-radius:999px; font-weight:700; font-size:0.9rem;
    border:1px solid transparent; transition:transform .15s ease, background .2s ease, color .2s ease;
    cursor:pointer; font-family:inherit;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{background:var(--accent); color:#fff8f0;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink);}
  .btn-ghost:hover{border-color:var(--accent); color:var(--accent);}
  .cta-row{display:flex; gap:12px; flex-wrap:wrap;}

  /* ===================== PÁGINA 1 — SOBRE ===================== */
  .hero-grid{
    display:grid; grid-template-columns:1.15fr 0.85fr; gap:48px; align-items:center;
    margin-bottom:56px;
  }
  @media (max-width:820px){ .hero-grid{grid-template-columns:1fr;} }
  .hero h1{font-size:clamp(2rem, 4.6vw, 3.1rem); line-height:1.1; margin-bottom:16px;}
  .hero h1 em{font-style:normal; color:var(--accent);}
  .hero p.lead{color:var(--ink-dim); font-size:1.05rem; max-width:520px; margin-bottom:26px;}

  .photo-frame{position:relative; width:min(260px, 100%); margin:0 auto;}
  .photo-frame::before{
    content:''; position:absolute; inset:-12px; border-radius:24px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    opacity:0.28; filter:blur(16px);
  }
  .photo-frame img{
    position:relative; width:100%; aspect-ratio:1/1.15; object-fit:cover;
    border-radius:20px; border:1px solid var(--line);
  }

  .quicklinks{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;}
  .quicklinks a{
    font-size:0.82rem; color:var(--ink-dim); font-weight:600;
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 14px; border:1px solid var(--line); border-radius:999px;
    background:var(--bg-card);
    transition:all .2s;
  }
  .quicklinks a:hover{border-color:var(--accent); color:var(--accent);}

  .section-head{margin-bottom:28px; max-width:640px;}
  .section-head h2{font-size:clamp(1.4rem,3vw,1.9rem);}
  .section-head p{color:var(--ink-dim); margin-top:8px;}

  .about-body p{color:var(--ink-dim); font-size:1rem; max-width:720px;}
  .about-body p + p{margin-top:14px;}
  .link-btn{ all:unset; color:var(--accent); font-weight:700; cursor:pointer; text-decoration:underline; }

  .contact-box{
    background:linear-gradient(135deg, var(--accent-soft), var(--accent2-soft));
    border:1px solid var(--line); border-radius:24px; padding:38px 36px;
    margin-top:48px;
  }
  .contact-box h2{font-size:clamp(1.3rem,2.6vw,1.7rem); margin-bottom:10px;}
  .contact-box p{color:var(--ink-dim); margin-bottom:22px;}

  /* ===================== PÁGINA 2 — PRODUÇÃO ===================== */
  .filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:30px;}
  .filter-btn{
    font-family:inherit; font-size:0.82rem; font-weight:700; color:var(--ink-dim);
    background:var(--bg-card); border:1px solid var(--line); border-radius:999px;
    padding:8px 16px; cursor:pointer; transition:all .2s;
  }
  .filter-btn:hover{border-color:var(--accent); color:var(--accent);}
  .filter-btn.active{background:var(--accent); border-color:var(--accent); color:#fff8f0;}

  .prod-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:18px; margin-bottom:52px;}
  .prod-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px; display:flex; flex-direction:column; gap:8px;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .prod-card:hover{transform:translateY(-3px); box-shadow:0 10px 26px rgba(58,44,34,0.08);}
  .prod-card .cat-tag{
    display:inline-block; font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    padding:4px 10px; border-radius:999px; width:fit-content;
  }
  .cat-tag.cat-academica{background:var(--accent2-soft); color:var(--accent-2);}
  .cat-tag.cat-profissional{background:var(--accent-soft); color:var(--accent);}
  .cat-tag.cat-escrita{background:#ece0c8; color:#8a6a3a;}
  .prod-card h4{font-size:1.02rem; line-height:1.32;}
  .prod-card .prod-meta{font-size:0.82rem; color:var(--ink-dim);}
  .prod-card .prod-desc{font-size:0.88rem; color:var(--ink-dim); margin-top:2px;}
  .prod-card .prod-link{
    margin-top:auto; padding-top:10px; font-size:0.84rem; font-weight:700; color:var(--accent);
    display:flex; align-items:center; gap:6px;
  }
  .prod-card .prod-link.disabled{color:var(--ink-dim); font-weight:600; font-style:italic;}

  .pub-list{display:flex; flex-direction:column; gap:12px; margin-bottom:52px;}
  .pub-item{
    background:var(--bg-card); border:1px solid var(--line); border-radius:12px;
    padding:16px 20px; font-size:0.9rem; color:var(--ink-dim);
  }
  .pub-item .pub-tag{
    display:inline-block; font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--accent-2); background:var(--accent2-soft); padding:3px 9px; border-radius:6px; margin-bottom:8px;
  }
  .pub-item strong{color:var(--ink);}

  /* ===================== PÁGINA 3 — CV ===================== */
  .cv-top{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:36px;}

  .degree-feature{
    background:linear-gradient(135deg, var(--bg-soft), var(--bg-card));
    border:1px solid var(--accent-soft);
    border-radius:var(--radius);
    padding:26px 28px;
    margin-bottom:26px;
  }
  .degree-feature .pill{
    display:inline-block; background:var(--accent-soft); color:var(--accent);
    font-size:0.72rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase;
    padding:5px 12px; border-radius:999px; margin-bottom:14px;
  }
  .degree-feature h3{font-size:1.28rem; margin-bottom:6px;}
  .degree-feature .meta{color:var(--ink-dim); font-size:0.9rem; margin-bottom:14px;}
  .degree-feature .detail-row{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-top:16px;
    font-size:0.85rem; color:var(--ink-dim);
  }
  .degree-feature .detail-row strong{color:var(--ink); display:block; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:3px;}

  .timeline{border-left:2px solid var(--line); margin-left:6px;}
  .t-item{position:relative; padding:0 0 24px 26px;}
  .t-item::before{
    content:''; position:absolute; left:-6px; top:4px; width:11px; height:11px;
    border-radius:50%; background:var(--bg); border:2px solid var(--accent);
  }
  .t-item h4{font-size:1rem; margin-bottom:3px;}
  .t-item .t-org{color:var(--accent); font-weight:600; font-size:0.87rem; margin-bottom:2px;}
  .t-item .t-date{color:var(--ink-dim); font-size:0.79rem; margin-bottom:6px; display:block;}
  .t-item p{color:var(--ink-dim); font-size:0.88rem; margin:0;}

  .cv-subtitle{font-size:1.15rem; margin:44px 0 16px; padding-top:24px; border-top:1px solid var(--line);}
  .cv-subtitle:first-of-type{border-top:none; padding-top:0;}
  .chip-wrap{display:flex; flex-wrap:wrap; gap:9px;}
  .chip{
    font-size:0.79rem; color:var(--ink-dim); border:1px solid var(--line);
    padding:7px 13px; border-radius:999px; background:var(--bg-card);
  }

  .exp-grid{display:grid; gap:14px;}
  .exp-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 22px; display:grid; grid-template-columns:150px 1fr; gap:18px;
  }
  @media (max-width:640px){.exp-card{grid-template-columns:1fr; gap:6px;}}
  .exp-card .date{color:var(--accent); font-weight:700; font-size:0.84rem;}
  .exp-card h4{font-size:1.02rem; margin-bottom:4px;}
  .exp-card .org{color:var(--ink-dim); font-size:0.87rem;}

  .skills-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:18px;}
  .skill-card{background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:20px;}
  .skill-card h4{font-size:0.92rem; margin-bottom:12px; color:var(--accent-2);}

  @media print{
    body{overflow:visible;}
    header, #page-sobre, #page-producao{display:none !important;}
    .page{position:static; opacity:1; visibility:visible; overflow:visible;}
    #page-cv{padding-top:0;}
    .btn-print{display:none;}
  }
</style>
</head>
<body>

<header>
  <nav>
    <div class="logo">Fontoura <span>Planejamento</span></div>
    <button class="navtoggle" id="navToggle" aria-label="Menu">&#9776;</button>
    <div class="nav-right">
      <ul class="navlinks" id="navLinks" role="tablist">
        <li><button data-page="sobre" class="active" data-i18n="nav_sobre"></button></li>
        <li><button data-page="producao" data-i18n="nav_producao"></button></li>
        <li><button data-page="cv" data-i18n="nav_cv"></button></li>
      </ul>
      <div class="lang-toggle">
        <button data-lang="pt" class="active">PT</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </nav>
</header>

<!-- ============================================================ -->
<!-- PÁGINA 1 — SOBRE + LINKS + CONTATO                            -->
<!-- ============================================================ -->
<section class="page active" id="page-sobre">
  <div class="page-inner">

    <div class="hero-grid">
      <div class="hero">
        <span class="eyebrow" data-i18n="hero_eyebrow"></span>
        <h1><span data-i18n="hero_title_pre"></span><em data-i18n="hero_title_em"></em></h1>
        <p class="lead" data-i18n="hero_lead"></p>
        <div class="cta-row">
          <button class="btn btn-primary" data-goto="producao" data-i18n="hero_cta_producao"></button>
          <button class="btn btn-ghost" data-goto="cv" data-i18n="hero_cta_cv"></button>
        </div>
        <div class="quicklinks">
          <a href="https://lattes.cnpq.br/5068339728969931" target="_blank" rel="noopener" data-i18n="hero_link_lattes"></a>
          <a href="https://www.researchgate.net/profile/Daniel-Fontoura-2" target="_blank" rel="noopener" data-i18n="hero_link_rg"></a>
          <a href="mailto:daniel.fontoura@ufabc.edu.br" data-i18n="hero_link_email"></a>
        </div>
      </div>
      <div class="photo-frame">
        <img src="profile.png" alt="Foto de Daniel Fontoura">
      </div>
    </div>

    <div class="section-head">
      <span class="eyebrow" data-i18n="sobre_eyebrow"></span>
      <h2 data-i18n="sobre_h2"></h2>
    </div>
    <div class="about-body" id="sobreBody">
      <!-- gerado via JS a partir de window.SOBRE -->
    </div>

    <div class="contact-box">
      <h2 data-i18n="contato_h2"></h2>
      <p data-i18n="contato_p"></p>
      <div class="cta-row">
        <a class="btn btn-primary" href="mailto:daniel.fontoura@ufabc.edu.br">daniel.fontoura@ufabc.edu.br</a>
        <a class="btn btn-ghost" href="https://lattes.cnpq.br/5068339728969931" target="_blank" rel="noopener">Lattes</a>
        <a class="btn btn-ghost" href="https://www.researchgate.net/profile/Daniel-Fontoura-2" target="_blank" rel="noopener">ResearchGate</a>
      </div>
    </div>

    <p style="color:var(--ink-dim); font-size:0.8rem; margin-top:40px;" data-i18n="footer_copy"></p>
  </div>
</section>

<!-- ============================================================ -->
<!-- PÁGINA 2 — PRODUÇÃO (acadêmica e profissional)                -->
<!-- ============================================================ -->
<section class="page" id="page-producao">
  <div class="page-inner">
    <div class="section-head">
      <span class="eyebrow" data-i18n="prod_eyebrow"></span>
      <h2 data-i18n="prod_h2"></h2>
      <p data-i18n="prod_p"></p>
    </div>

    <div class="filter-row" id="filterRow">
      <button class="filter-btn active" data-filter="todos" data-i18n="filter_todos"></button>
      <button class="filter-btn" data-filter="profissional" data-i18n="filter_profissional"></button>
      <button class="filter-btn" data-filter="academica" data-i18n="filter_academica"></button>
      <button class="filter-btn" data-filter="escrita" data-i18n="filter_escrita"></button>
    </div>

    <div class="prod-grid" id="prodGrid"><!-- gerado via JS a partir de PRODUCOES --></div>

    <div class="section-head">
      <span class="eyebrow" data-i18n="pub_eyebrow"></span>
      <h2 data-i18n="pub_h2"></h2>
      <p id="pubIntro"></p>
    </div>
    <div class="pub-list" id="pubList"><!-- gerado via JS a partir de PUBLICACOES --></div>
  </div>
</section>

<!-- ============================================================ -->
<!-- PÁGINA 3 — CV INTERATIVO                                      -->
<!-- ============================================================ -->
<section class="page" id="page-cv">
  <div class="page-inner">
    <div class="cv-top">
      <div>
        <span class="eyebrow" data-i18n="cv_eyebrow"></span>
        <h2 style="font-size:clamp(1.5rem,3vw,2rem);" data-i18n="cv_h2"></h2>
      </div>
      <button class="btn btn-ghost btn-print" onclick="window.print()" data-i18n="cv_print"></button>
    </div>

    <h3 class="cv-subtitle" data-i18n="cv_sec_formacao"></h3>
    <div class="degree-feature" id="cvMestrado"><!-- gerado via JS --></div>
    <div class="timeline" id="cvFormacao"><!-- gerado via JS --></div>

    <h3 class="cv-subtitle" data-i18n="cv_sec_complementar"></h3>
    <div class="chip-wrap" id="cvComplementar"><!-- gerado via JS --></div>

    <h3 class="cv-subtitle" data-i18n="cv_sec_experiencia"></h3>
    <div class="exp-grid" id="cvExperiencia"><!-- gerado via JS --></div>

    <h3 class="cv-subtitle" data-i18n="cv_sec_habilidades"></h3>
    <div class="skills-grid" id="cvHabilidades"><!-- gerado via JS --></div>
  </div>
</section>

<script src="data.js"></script>
<script>
let LANG = 'pt';
const CAT_LABEL_KEY = { profissional:"cat_profissional", academica:"cat_academica", escrita:"cat_escrita" };

function S(key){ return (window.STRINGS[LANG] && window.STRINGS[LANG][key]) || window.STRINGS.pt[key] || ''; }

function applyStrings(){
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    el.textContent = S(key);
  });
  document.title = LANG === 'en' ? 'Fontoura Planejamento — Daniel Fontoura' : 'Fontoura Planejamento — Daniel Fontoura';
  document.getElementById('pubIntro').innerHTML =
    S('pub_p_pre') + '<a href="https://lattes.cnpq.br/5068339728969931" target="_blank" rel="noopener" style="color:var(--accent);">' + S('pub_p_lattes') + '</a>' +
    S('pub_p_mid') + '<a href="https://www.researchgate.net/profile/Daniel-Fontoura-2" target="_blank" rel="noopener" style="color:var(--accent);">' + S('pub_p_rg') + '</a>' + S('pub_p_post');
}

function renderSobre(){
  const s = window.SOBRE[LANG] || window.SOBRE.pt;
  const body = document.getElementById('sobreBody');
  body.innerHTML = `
    <p>${s.p1}</p>
    <p>${s.p2}</p>
    <p>${S('sobre_p3_pre')}<button class="link-btn" data-goto="cv">${S('sobre_p3_cv')}</button>${S('sobre_p3_mid')}<button class="link-btn" data-goto="producao">${S('sobre_p3_prod')}</button>${S('sobre_p3_post')}</p>
  `;
  body.querySelectorAll('[data-goto]').forEach(el => el.addEventListener('click', () => goToPage(el.dataset.goto)));
}

function renderProducoes(filter){
  const grid = document.getElementById('prodGrid');
  grid.innerHTML = '';
  window.PRODUCOES
    .filter(p => filter === 'todos' || p.categoria === filter)
    .forEach(p => {
      const card = document.createElement('div');
      card.className = 'prod-card';
      const hasLink = p.arquivo || p.link;
      const linkHref = p.arquivo ? p.arquivo : p.link;
      const titulo = LANG === 'en' ? (p.tituloEN || p.titulo) : p.titulo;
      const descricao = LANG === 'en' ? (p.descricaoEN || p.descricao) : p.descricao;
      card.innerHTML = `
        <span class="cat-tag cat-${p.categoria}">${S(CAT_LABEL_KEY[p.categoria])}</span>
        <h4>${titulo}</h4>
        <div class="prod-meta">${p.subtitulo || ''}${p.subtitulo && p.periodo ? ' · ' : ''}${p.periodo || ''}</div>
        <div class="prod-desc">${descricao || ''}</div>
        ${hasLink
          ? `<a class="prod-link" href="${linkHref}" target="_blank" rel="noopener">${S('prod_link_ver')}</a>`
          : `<span class="prod-link disabled">${S('prod_link_disabled')}</span>`}
      `;
      grid.appendChild(card);
    });
}

function renderPublicacoes(){
  const list = document.getElementById('pubList');
  list.innerHTML = window.PUBLICACOES.map(p => `
    <div class="pub-item">
      <span class="pub-tag">${p.tag}</span><br>
      ${p.texto}
    </div>
  `).join('');
}

function renderCV(){
  const cv = window.CV[LANG] || window.CV.pt;

  document.getElementById('cvMestrado').innerHTML = `
    <span class="pill">${cv.mestrado.pill}</span>
    <h3>${cv.mestrado.titulo}</h3>
    <div class="meta">${cv.mestrado.instituicao}</div>
    <div class="detail-row">
      <div><strong>${S('cv_tcc_label')}</strong>${cv.mestrado.tcc}</div>
      <div><strong>${S('cv_orientador_label')}</strong>${cv.mestrado.orientador}</div>
      <div><strong>${S('cv_coorientador_label')}</strong>${cv.mestrado.coorientador}</div>
      <div><strong>${S('cv_area_label')}</strong>${cv.mestrado.area}</div>
    </div>
  `;

  document.getElementById('cvFormacao').innerHTML = cv.formacao.map(f => `
    <div class="t-item">
      <h4>${f.titulo}</h4>
      <span class="t-org">${f.instituicao}</span>
      <span class="t-date">${f.periodo}</span>
      ${f.detalhe ? `<p>${f.detalhe}</p>` : ''}
    </div>
  `).join('');

  document.getElementById('cvComplementar').innerHTML = cv.complementar.map(c => `<span class="chip">${c}</span>`).join('');

  document.getElementById('cvExperiencia').innerHTML = cv.experiencia.map(e => `
    <div class="exp-card">
      <div class="date">${e.periodo}</div>
      <div>
        <h4>${e.cargo}</h4>
        <div class="org">${e.empresa}</div>
      </div>
    </div>
  `).join('');

  document.getElementById('cvHabilidades').innerHTML = cv.habilidades.map(h => `
    <div class="skill-card">
      <h4>${h.categoria}</h4>
      <div class="chip-wrap">${h.itens.map(i => `<span class="chip">${i}</span>`).join('')}</div>
    </div>
  `).join('');
}

function renderAll(){
  applyStrings();
  renderSobre();
  const activeFilter = document.querySelector('.filter-btn.active')?.dataset.filter || 'todos';
  renderProducoes(activeFilter);
  renderPublicacoes();
  renderCV();
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderProducoes(btn.dataset.filter);
  });
});

document.querySelectorAll('.lang-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    LANG = btn.dataset.lang;
    document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.toggle('active', b.dataset.lang === LANG));
    document.documentElement.lang = LANG === 'en' ? 'en' : 'pt-BR';
    renderAll();
  });
});

/* ===================== NAVEGAÇÃO ENTRE PÁGINAS ===================== */
function goToPage(name){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.navlinks button[data-page]').forEach(b => b.classList.toggle('active', b.dataset.page === name));
  document.getElementById('page-' + name).scrollTop = 0;
  history.replaceState(null, '', '#' + name);
  document.getElementById('navLinks').classList.remove('open');
}
document.querySelectorAll('.navlinks button[data-page]').forEach(btn => {
  btn.addEventListener('click', () => goToPage(btn.dataset.page));
});
document.querySelectorAll('[data-goto]').forEach(el => {
  el.addEventListener('click', () => goToPage(el.dataset.goto));
});
const navToggle = document.getElementById('navToggle');
navToggle.addEventListener('click', () => document.getElementById('navLinks').classList.toggle('open'));

renderAll();
const initial = (location.hash || '').replace('#','');
if (['sobre','producao','cv'].includes(initial)) goToPage(initial);
</script>
</body>
</html>
